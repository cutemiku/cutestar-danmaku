# 星萌弹幕姬 all-in-one 容器 nginx 配置
# 静态前端由 nginx 直接服务，/api 与 WebSocket 反向代理到同容器内的 uvicorn（127.0.0.1:8000）
#   /    → React 构建产物（参与者 + 运营控制台，BrowserRouter 需 SPA fallback）
#   /m/  → mobile-sender 轻量发送端（静态）
#   /api → FastAPI + WebSocket（同源，零 CORS）

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 生产安全响应头（与 web/vite.config.ts preview 保持一致）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream cutestar_api {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # 静态资源缓存（expires 自带 Cache-Control；不在此层加 add_header，
        # 避免覆盖 server 级安全响应头 —— nginx 子级 add_header 不继承父级）
        location ~* \.(css|js)$ {
            expires 1h;
        }

        # API + WebSocket 反代（含 /health 探测）
        location /api/ {
            proxy_pass http://cutestar_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;  # WS 长连接
        }

        location = /health {
            proxy_pass http://cutestar_api;
        }

        # mobile-sender 轻量发送端（静态子路径）
        location /m/ {
            alias /usr/share/nginx/html/m/;
            index index.html;
            try_files $uri $uri/ /m/index.html;
        }

        # React 主站：hash/路径路由，SPA fallback 到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
