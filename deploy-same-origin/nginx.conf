# Cutestar 同源部署 — nginx 配置
# 静态前端由 nginx 直接服务，/api 与 WebSocket 反向代理到后端（同源，零 CORS）

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 后端服务地址（docker-compose 服务名；本地直接部署改为 127.0.0.1:8000）
    upstream cutestar_api {
        server server:8000;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # 静态资源长缓存（带 hash 文件名可长期缓存，此处简单 1h）
        location ~* \.(css|js)$ {
            expires 1h;
            add_header Cache-Control "public";
        }

        # API + WebSocket 反代（含 /health 探测）
        location /api/ {
            proxy_pass http://cutestar_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;  # WS 长连接
        }

        location = /health {
            proxy_pass http://cutestar_api;
        }

        # 前端入口（hash 路由，无需 fallback）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
