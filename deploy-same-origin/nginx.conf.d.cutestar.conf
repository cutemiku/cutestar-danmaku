# Cutestar 同源部署 — Linux (Ubuntu/Debian) nginx 配置
# conf.d 风格：放到 /etc/nginx/conf.d/cutestar.conf 后 reload 即可
# 全局配置（events/http 等）由 /etc/nginx/nginx.conf 主配置负责，这里只写 server 块。

# 后端地址：本机 uvicorn 默认 8000
# 如果后端在另一台机器，改为内网 IP，例如 server 192.168.1.10:8000;
upstream cutestar_api {
    server 127.0.0.1:8000;
}

# WebSocket 升级映射（map 需写在 http 上下文，主配置已 include 本文件，因此可以放在这里）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ★ 修改：改为服务器上 public 目录的实际路径
    root /opt/cutestar/deploy-same-origin/public;
    index index.html;

    # 静态资源缓存
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # API + WebSocket 反代
    location /api/ {
        proxy_pass http://cutestar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;  # WS 长连接
    }

    location = /health {
        proxy_pass http://cutestar_api;
    }

    # 前端入口（hash 路由，无需 SPA fallback 也可，保留兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
