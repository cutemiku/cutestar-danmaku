# Cutestar 同源部署 — Windows 本机 nginx 配置
# 用法：把本文件内容替换到 nginx 安装目录 conf/nginx.conf，改两处路径后启动。

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 后端地址（本机 FastAPI，uvicorn 默认 8000）
    upstream cutestar_api {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        # ★ 修改 1：改为你的 public 目录绝对路径（nginx 使用正斜杠，含空格需加引号）
        root  "F:/Cache/杂项代码/cutestar-danmaku/deploy-same-origin/public";
        index index.html;

        # 静态资源缓存
        location ~* \.(css|js)$ {
            expires 1h;
            add_header Cache-Control "public";
        }

        # API + WebSocket 反代
        location /api/ {
            proxy_pass http://cutestar_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;  # WS 长连接
        }

        location = /health {
            proxy_pass http://cutestar_api;
        }

        # 前端入口
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
